# Build the sibling-payload micro.sfx runtimes for Grafida.
#
# phpmicro is a PHP SAPI: it cannot be built standalone. This workflow checks
# out stock static-php-cli as the build tool and points it back at THIS
# repository (-L custom-local source), producing a micro.sfx per platform with
# the extension set Boson's "standard" macOS edition ships. macOS and Windows are
# fully static; Linux links glibc dynamically (see the build-linux job).
#
# Every run publishes what it built twice:
#   - to the rolling "sfx-latest" release, whose assets Grafida's Boson-era
#     scripts/fetch-sfx.sh downloads into build/sfx/;
#   - to an immutable "sfx-<YYYYMMDD>.<run>" release, never touched again, so a
#     consumer can pin a tag + SHA-256 that a later push cannot invalidate
#     (grafida/shell-packager does; grafida/grafida#86).
#
# ⚠️ So every push to sibling-phar rebuilds every platform and REWRITES
# sfx-latest, which changes what Boson's release ships. A commit that is not
# meant to rebuild (a script, a doc, this file) carries [skip ci].
#
# A dispatch with platforms=promote-<asset> builds nothing and never writes
# sfx-latest: it takes that asset as it is in sfx-latest, checks it against the
# SHA-256 the dispatcher states and against the published .sha256, runs the
# platform's check script on it, and publishes it alone to a new immutable
# release (grafida/grafida#88). This is how a runtime that has only ever been
# in sfx-latest gets a pin without a rebuild:
#
#   gh workflow run build-sfx.yml -R grafida/phpmicro --ref sibling-phar \
#     -f platforms=promote-macos-aarch64 -f sha256=<hash>
#
# (It is a mode of this workflow, not a workflow of its own, because GitHub
# only dispatches a workflow that is on the default branch, master, or has run
# before.)
name: Build micro.sfx

on:
  push:
    branches: [sibling-phar]
  # A manual run can build (and publish) a subset, so adding or fixing one
  # platform does not rebuild the others: a rebuild picks up the newest PHP
  # patch release, which changes what consumers of sfx-latest ship.
  workflow_dispatch:
    inputs:
      platforms:
        description: Which runtimes to build and publish, or one sfx-latest asset to promote unchanged
        type: choice
        options: [all, linux, macos, windows, promote-macos-aarch64]
        default: all
      sha256:
        description: For promote-*, the SHA-256 of the asset being promoted (anything else is refused)
        type: string
        default: ""
      runner:
        description: For promote-*, the arm64 macOS runner that checks it (GitHub's macos-15 pool is sometimes out of capacity)
        type: choice
        options: [macos-15, macos-26]
        default: macos-15

env:
  PHP_VERSION: "8.4"
  # static-php-cli commit to build with (branch v3, as of 2026-07-27, the last
  # one known to work). Do NOT track the branch head: from 7d11cad5 (2026-08-07)
  # a `-L php-micro:<path>` local source is no longer linked into
  # php-src/sapi/micro, so the Windows build dies with "Reading file
  # ...\sapi\micro\php_micro.c failed". Bump deliberately, after checking it.
  SPC_REF: "59584de4aa9d8067e4ce30d2ff990e7b9e14db43"
  # Boson's STANDARD_SFX_EXTENSIONS (vendor/boson-php/compiler, MacOSBuiltinTarget)
  EXTENSIONS: "ctype,curl,dom,ffi,filter,iconv,libxml,mbstring,opcache,openssl,pdo,pdo_sqlite,phar,shmop,sockets,sodium,sqlite3,xml,zlib"
  # static-php-cli downloads prebuilt tools/sources from GitHub; without a token
  # the anonymous API rate limit on shared runners makes those downloads fail.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: macos-aarch64.standard.sfx
          - runner: macos-15-intel
            arch: x86_64
            asset: macos-x86_64.standard.sfx
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, openssl, mbstring, tokenizer, phar

      - name: Check out static-php-cli (build tool)
        run: |
          git clone https://github.com/crazywhalecc/static-php-cli.git spc-tool
          git -C spc-tool checkout ${{ env.SPC_REF }}

      - name: Prepare static-php-cli
        working-directory: spc-tool
        run: |
          composer install --no-interaction --no-progress
          bin/spc doctor --auto-fix

      - name: Download sources (php-micro = this repository)
        working-directory: spc-tool
        run: |
          bin/spc download --with-php=${{ env.PHP_VERSION }} \
            --for-extensions="${{ env.EXTENSIONS }}" \
            -L "php-micro:${{ github.workspace }}"
          # (-L records the local path; nothing lands in downloads/php-micro.
          # The smoke-test step below is the real guard that the sibling patch
          # made it into the binary — its sibling modes fail on stock phpmicro.)

      - name: Build micro.sfx
        working-directory: spc-tool
        run: bin/spc build "${{ env.EXTENSIONS }}" --build-micro

      # Also the guard that the sibling patch made it into the binary: the
      # sibling modes fail on stock phpmicro.
      - name: Check the binary and smoke-test the payload modes
        env:
          EXPECT_ARCH: ${{ matrix.arch }}
        run: .github/scripts/check-macos-sfx.sh spc-tool/buildroot/bin/micro.sfx

      - name: Rename artifact
        run: |
          mkdir -p out
          cp spc-tool/buildroot/bin/micro.sfx "out/${{ matrix.asset }}"
          shasum -a 256 "out/${{ matrix.asset }}" > "out/${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  # Windows is a separate job: static-php-cli uses a different toolchain there
  # (php-sdk-binary-tools + MSVC, not autotools), PE executables must be named
  # *.exe to run, and there is no chmod — so the download/build steps mirror the
  # unix job but the smoke test and packaging are PowerShell.
  build-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, openssl, mbstring, tokenizer, phar

      - name: Check out static-php-cli (build tool)
        run: |
          git clone https://github.com/crazywhalecc/static-php-cli.git spc-tool
          git -C spc-tool checkout ${{ env.SPC_REF }}

      - name: Prepare static-php-cli
        working-directory: spc-tool
        # --no-dev: SPC needs none of its dev tools to build micro.sfx, and one of
        # them (captainhook/captainhook-phar via phar-io/composer-distributor)
        # GPG-verifies a PHAR download during install, which fails on the Windows
        # runner ("Could not import required GPG key!"). Skipping dev deps sidesteps
        # GPG entirely and is deterministic. (The unix job keeps dev deps — its
        # runners have a working gpg — but --no-dev would be fine there too.)
        run: |
          composer install --no-interaction --no-progress --no-dev
          bin/spc doctor --auto-fix

      - name: Download sources (php-micro = this repository)
        working-directory: spc-tool
        run: >
          bin/spc download --with-php=${{ env.PHP_VERSION }}
          --for-extensions="${{ env.EXTENSIONS }}"
          -L "php-micro:${{ github.workspace }}"

      # --enable-micro-win32 links the SFX as a GUI-subsystem PE
      # (/SUBSYSTEM:WINDOWS) and defines PHP_MICRO_WIN32_NO_CONSOLE. Without it
      # micro.sfx is a console app, so Windows hands every consumer built on it
      # a conhost window it never asked for: launching Grafida or Akeeba Extract
      # from the Start menu pops a black command window behind the real UI
      # (akeeba/extract#4). These SFXen only ever back GUI applications, so the
      # console subsystem buys nothing.
      #
      # It does NOT cost us argv: the NO_CONSOLE build enters through WinMain()
      # and recovers argc/argv from the CRT's __argc/__argv, so $_SERVER['argv']
      # still carries the command line — which is what makes file associations
      # ("open this .jpa with Akeeba Extract") work.
      - name: Build micro.sfx
        working-directory: spc-tool
        run: bin/spc build "${{ env.EXTENSIONS }}" --build-micro --enable-micro-win32

      - name: Smoke-test the sibling payload modes
        working-directory: spc-tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Run a native console app and capture its stdout. Start-Process with an
          # explicit -RedirectStandardOutput genuinely redirects the child's stdout
          # (unlike pwsh's `& native > file`, which under a Stop preference throws
          # "StandardOutputEncoding is only supported when standard output is
          # redirected"), so it works reliably for phpmicro's CLI output.
          function Invoke-Payload([string]$name) {
              $exe  = Join-Path $PWD $name
              $outF = Join-Path $PWD 'run.out'
              $errF = Join-Path $PWD 'run.err'
              $p = Start-Process -FilePath $exe -WorkingDirectory $PWD -NoNewWindow -Wait -PassThru `
                     -RedirectStandardOutput $outF -RedirectStandardError $errF
              if ($p.ExitCode -ne 0) {
                  Write-Host "stderr: $(Get-Content $errF -Raw)"
                  throw "$name exited $($p.ExitCode)"
              }
              return (Get-Content $outF -Raw).Trim()
          }

          $sfx = 'buildroot/bin/micro.sfx'
          if (-not (Test-Path $sfx)) { throw "micro.sfx not built at $sfx" }

          # The SFX must be a GUI-subsystem PE (--enable-micro-win32). A console
          # -subsystem build works perfectly well but gives every consumer app a
          # stray conhost window at launch (akeeba/extract#4), which is exactly
          # the kind of regression nobody notices until it ships. Read the PE
          # Optional Header's Subsystem field: e_lfanew (uint32 @ 0x3C), then
          # + 4 (PE signature) + 20 (COFF header) + 68 = the uint16 Subsystem.
          # 2 = IMAGE_SUBSYSTEM_WINDOWS_GUI, 3 = ..._WINDOWS_CUI.
          $pe = [System.IO.File]::ReadAllBytes((Join-Path $PWD $sfx))
          $eLfanew = [BitConverter]::ToUInt32($pe, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($pe, $eLfanew + 4 + 20 + 68)
          if ($subsystem -ne 2) {
              throw "micro.sfx is subsystem $subsystem, expected 2 (WINDOWS_GUI) — was --enable-micro-win32 dropped from the build step?"
          }
          Write-Host 'GUI subsystem (console-less) confirmed'

          Set-Content -NoNewline -Path t.php -Value '<?php echo "ok";'

          # appended payload (regression): micro.sfx PE + script, concatenated into
          # a PE. Build it via a FileStream — cmd's `copy /b` mis-parses forward-
          # slash paths, and `byte[] + byte[]` in pwsh boxes into a huge Object[].
          $fs = [System.IO.File]::Create((Join-Path $PWD 'comb.exe'))
          foreach ($part in @($sfx, 't.php')) {
              $bytes = [System.IO.File]::ReadAllBytes($part)
              $fs.Write($bytes, 0, $bytes.Length)
          }
          $fs.Close()
          $out = Invoke-Payload 'comb.exe'
          if ($out -ne 'ok') { throw "appended mode failed: got '$out'" }

          # sibling "<self>.phar" (grafida ships the split payload as t.exe + t.phar)
          Copy-Item $sfx t.exe
          Copy-Item t.php t.phar
          $out = Invoke-Payload 't.exe'
          if ($out -ne 'ok') { throw "sibling mode failed: got '$out'" }
          Write-Host 'sibling payload smoke test passed'

          # SIGNED sibling stub — the layout grafida actually ships. Authenticode
          # appends a certificate table at EOF, PAST the last PE section, so the
          # signed stub's file size exceeds its section end. sfxsize must fold in
          # the certificate table (IMAGE_DIRECTORY_ENTRY_SECURITY); otherwise the
          # stub looks like it carries an appended payload and the sibling fallback
          # never fires — it would try to load the certificate as the phar. Verify
          # with a throwaway self-signed cert (trust is irrelevant; we only need the
          # certificate table appended so the runtime hits that code path).
          Copy-Item $sfx signed.exe
          Copy-Item t.php signed.phar
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
                    -Subject 'CN=Grafida SFX Smoke Test' -CertStoreLocation Cert:\CurrentUser\My
          $null = Set-AuthenticodeSignature -FilePath signed.exe -Certificate $cert
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          if ((Get-Item signed.exe).Length -le (Get-Item $sfx).Length) {
              throw "signing did not append a certificate table (test would be a no-op)"
          }
          $out = Invoke-Payload 'signed.exe'
          if ($out -ne 'ok') { throw "signed sibling mode failed: got '$out'" }
          Write-Host 'signed sibling payload smoke test passed'

      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $asset = 'windows-x86_64.standard.sfx'
          Copy-Item spc-tool/buildroot/bin/micro.sfx "out/$asset"
          # Emit "<hash>  <name>" so scripts/fetch-sfx.sh (awk '{print $1}') reads it
          $hash = (Get-FileHash "out/$asset" -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "out/$asset.sha256" -Value "$hash  $asset"

      # Collect the Visual C++ 2015-2022 runtime DLLs (app-local redistributable)
      # and publish them alongside the SFX. They are NOT a phpmicro dependency (the
      # SFX is statically linked); they are for the CONSUMER: Boson's prebuilt
      # libboson-windows-x86_64.dll imports MSVCP140*/VCRUNTIME140*, which a clean
      # Windows (especially Server) lacks. Grafida ships them next to grafida.exe so
      # its per-user, no-admin installer is self-contained. This Windows CI is the
      # only place in the toolchain with a real VS install, hence here. Sourced from
      # the VS Redist folder — the canonical redistributable copy, app-local
      # deployment permitted by its license.
      - name: Collect the Visual C++ runtime (for Grafida's app-local bundle)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "Visual Studio not found via vswhere" }
          $need = @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','MSVCP140_ATOMIC_WAIT.dll')

          # Locate an x64 folder that actually holds ALL of the runtime DLLs. The
          # redist layout is not stable: the version dir may be numeric (14.44.x)
          # or a `v143` alias that carries no x64 subtree, so a plain "newest name"
          # pick lands on an empty path. Recurse instead and keep only a folder
          # containing the complete set; fall back to the compiler's own x64
          # runtime dir (VC\Tools\MSVC\<ver>\bin\Hostx64\x64) if no redist matches.
          function Find-Crt([string] $root, [string[]] $files) {
              if (-not (Test-Path $root)) { return $null }
              Get-ChildItem $root -Recurse -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\x64($|\\)' } |
                  Where-Object {
                      $dir = $_.FullName
                      (@($files | Where-Object { Test-Path (Join-Path $dir $_) }).Count) -eq $files.Count
                  } |
                  Sort-Object FullName -Descending | Select-Object -First 1
          }
          $crt = Find-Crt (Join-Path $vs 'VC\Redist\MSVC') $need
          if (-not $crt) { $crt = Find-Crt (Join-Path $vs 'VC\Tools\MSVC') $need }
          if (-not $crt) { throw "No x64 VC++ runtime folder holding all of: $($need -join ', ')" }
          Write-Host "VC++ CRT source: $($crt.FullName)"
          New-Item -ItemType Directory -Force -Path vcrt | Out-Null
          foreach ($d in $need) {
              Copy-Item (Join-Path $crt.FullName $d) (Join-Path 'vcrt' $d)
          }
          $zip = 'out/vc-runtime-x86_64.zip'
          Compress-Archive -Path vcrt/* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "$zip.sha256" -Value "$hash  vc-runtime-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64.standard.sfx
          path: out/*

  # Linux links glibc dynamically and everything else statically: a fully static
  # (musl) binary has no NSS, so names resolved through nss-mdns (".local"),
  # systemd-resolved or libvirt would not resolve, and static glibc is worse
  # (it dlopens the host's NSS modules, which must match its own glibc).
  #
  # SPC_TOOLCHAIN selects static-php-cli's GCC toolchain, which links the glibc
  # of the build host: Ubuntu 22.04's 2.35, the floor the Grafida shell already
  # has (grafida/shell ADR 0001); SPC_TARGET=native-native-gnu makes the rest of
  # static-php-cli treat the libc as glibc. Both are needed: config/env.ini
  # defaults SPC_TARGET to <arch>-linux-musl, and with a target set the
  # toolchain manager ignores SPC_LIBC and builds static musl with Zig. Not the
  # Zig toolchain's `native-native-gnu.2.35` either: phpmicro's dynamic link
  # line takes libresolv statically (`-Wl,-Bstatic,-lresolv,-Bdynamic`), which
  # `zig cc` rejects ("unsupported linker arg"). The result needs libc, libm
  # and libgcc_s, nothing else.
  #
  # static-php-cli hard-codes `--enable-micro=all-static` on Linux, which would
  # link glibc statically whatever the toolchain; the later `--enable-micro` in
  # SPC_EXTRA_PHP_VARS wins (autoconf keeps the last value of an option).
  # .github/scripts/check-linux-sfx.sh fails the job if the result is not what
  # we meant.
  build-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: linux-x86_64.standard.sfx
          - runner: ubuntu-22.04-arm
            asset: linux-aarch64.standard.sfx
    runs-on: ${{ matrix.runner }}
    env:
      SPC_TOOLCHAIN: StaticPHP\Toolchain\GccNativeToolchain
      SPC_TARGET: native-native-gnu
      SPC_EXTRA_PHP_VARS: --enable-micro
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, openssl, mbstring, tokenizer, phar

      - name: Check out static-php-cli (build tool)
        run: |
          git clone https://github.com/crazywhalecc/static-php-cli.git spc-tool
          git -C spc-tool checkout ${{ env.SPC_REF }}

      - name: Prepare static-php-cli
        working-directory: spc-tool
        run: |
          composer install --no-interaction --no-progress --no-dev
          bin/spc doctor --auto-fix

      - name: Download sources (php-micro = this repository)
        working-directory: spc-tool
        run: |
          bin/spc download --with-php=${{ env.PHP_VERSION }} \
            --for-extensions="${{ env.EXTENSIONS }}" \
            -L "php-micro:${{ github.workspace }}"

      - name: Build micro.sfx
        working-directory: spc-tool
        run: bin/spc build "${{ env.EXTENSIONS }}" --build-micro

      - name: Check the binary and smoke-test the payload modes
        run: .github/scripts/check-linux-sfx.sh spc-tool/buildroot/bin/micro.sfx

      - name: Rename artifact
        run: |
          mkdir -p out
          cp spc-tool/buildroot/bin/micro.sfx "out/${{ matrix.asset }}"
          (cd out && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  publish:
    needs: [build, build-windows, build-linux]
    runs-on: ubuntu-latest
    # Skipped jobs (a subset dispatch) are fine; a failed one publishes nothing.
    # A promotion builds nothing and must never write sfx-latest.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name != 'pull_request' && !startsWith(inputs.platforms, 'promote-') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish rolling sfx-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Rolling build of the sibling-payload micro.sfx runtimes (PHP ${PHP_VERSION}, branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA})."
          gh release view sfx-latest >/dev/null 2>&1 \
            || gh release create sfx-latest --title "micro.sfx (rolling)" --notes "$NOTES" --latest=false
          gh release edit sfx-latest --notes "$NOTES"
          gh release upload sfx-latest assets/* --clobber

      # Created as a draft and published only once every asset is up, so a
      # half-uploaded release is never visible; then never written to again.
      # A re-run attempt gets its own tag rather than overwriting this one.
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sfx-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || TAG="$TAG.$GITHUB_RUN_ATTEMPT"
          NOTES="Immutable build of the sibling-payload micro.sfx runtimes: PHP ${PHP_VERSION}, static-php-cli ${SPC_REF}, branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA}. Assets: $(cd assets && ls | grep -v '\.sha256$' | tr '\n' ' ')"
          gh release create "$TAG" assets/* --draft --target "$GITHUB_SHA" \
            --title "micro.sfx $TAG" --notes "$NOTES" --latest=false
          gh release edit "$TAG" --draft=false --latest=false
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"

  # --- promotion (dispatch only; see the header) -------------------------------
  promote-check:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.platforms, 'promote-macos-')
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: phar

      - name: Download from sfx-latest and verify
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.platforms }}
          EXPECTED: ${{ inputs.sha256 }}
        run: |
          ASSET="${PLATFORMS#promote-}.standard.sfx"
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "sha256 must be 64 lower-case hex digits" >&2; exit 1; }
          mkdir -p in out
          gh release download sfx-latest -R "$GITHUB_REPOSITORY" -p "$ASSET" -p "$ASSET.sha256" -D in
          actual="$(shasum -a 256 "in/$ASSET" | awk '{print $1}')"
          published="$(awk '{print $1}' "in/$ASSET.sha256")"
          echo "requested $EXPECTED"; echo "actual    $actual"; echo "published $published"
          [ "$actual" = "$EXPECTED" ] || { echo "the asset is not the one requested" >&2; exit 1; }
          [ "$published" = "$EXPECTED" ] || { echo "the published .sha256 disagrees" >&2; exit 1; }
          cp "in/$ASSET" "out/$ASSET"
          (cd out && shasum -a 256 "$ASSET" > "$ASSET.sha256")
          ASSET="$ASSET" gh release view sfx-latest -R "$GITHUB_REPOSITORY" --json body,assets \
            -q '"Promoted from sfx-latest, whose notes then read: " + .body, (.assets[] | select(.name == env.ASSET) | "The asset was uploaded there at " + .updatedAt + ".")' \
            > provenance.txt
          cat provenance.txt
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Check the binary and smoke-test the payload modes
        env:
          EXPECT_ARCH: arm64
        run: .github/scripts/check-macos-sfx.sh "out/$ASSET"

      - run: mv provenance.txt out/

      - uses: actions/upload-artifact@v4
        with:
          name: promoted
          path: out/*

  # Never touches sfx-latest. Created as a draft and published once every asset
  # is up, never marked Latest, and never written to again.
  promote-publish:
    needs: promote-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: promoted
          path: out

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUNNER: ${{ inputs.runner }}
        run: |
          TAG="sfx-$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || TAG="$TAG.$GITHUB_RUN_ATTEMPT"
          set -- out/*.standard.sfx
          [ "$#" = 1 ] && [ -f "$1" ] || { echo "expected exactly one runtime in the artifact" >&2; exit 1; }
          ASSET="$(basename "$1")"
          NOTES="Immutable promotion of ${ASSET}, unchanged (SHA-256 $(awk '{print $1}' "out/$ASSET.sha256")), checked by check-macos-sfx.sh on ${CHECK_RUNNER} in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. $(cat out/provenance.txt)"
          gh release create "$TAG" "out/$ASSET" "out/$ASSET.sha256" -R "$GITHUB_REPOSITORY" \
            --draft --target "$GITHUB_SHA" --title "micro.sfx $TAG" --notes "$NOTES" --latest=false
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest=false
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
